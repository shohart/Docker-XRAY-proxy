x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  xray:
    image: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:latest}
    container_name: xray
    restart: unless-stopped
    network_mode: "host"
    user: "0:0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config:/etc/xray
      - ./data:/var/log/xray
    command: ["run", "-c", "/etc/xray/config.json"]
    # Guard against the upstream Xray memory-leak (balancer+observatory):
    # cap the container so a runaway heap OOM-restarts instead of eating RAM,
    # and force the Go runtime to GC earlier.
    mem_limit: 4g
    # memswap_limit == mem_limit disables swap for the container (cgroup v2
    # ignores mem_swappiness), so a runaway heap really OOM-restarts instead
    # of thrashing in swap at the limit.
    memswap_limit: 4g
    mem_swappiness: 0
    environment:
      GOMEMLIMIT: "3GiB"
      GOGC: "50"
    logging: *default-logging

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: xray-gateway:latest
    container_name: xray-gateway
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    init: true
    stop_grace_period: 10s
    volumes:
      - ./scripts:/scripts:ro
    env_file:
      - .env
    logging: *default-logging

  openvpn:
    image: alpine:3.20
    container_name: xray-openvpn
    # Opt-in: the VPN server (195.66.87.175) is unreachable, so the tunnel is
    # disabled until a new .ovpn arrives. Re-enable with
    # `docker compose --profile openvpn up -d` + OPENVPN_FALLBACK_ENABLED=1.
    profiles: ["openvpn"]
    restart: unless-stopped
    # Bridge network on purpose: redirect-gateway inside must NOT hijack the
    # host's default route. xray (host net) reaches the SOCKS proxy via the
    # loopback-published port below.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      # sockd resolves target hostnames through the tunnel (routed via tun0).
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:${OPENVPN_SOCKS_PORT:-1081}:1080"
    volumes:
      - ./scripts:/scripts:ro
      - ./secrets/bykinpc.ovpn:/etc/openvpn/client.ovpn:ro
    environment:
      OVPN_CONFIG: /etc/openvpn/client.ovpn
      OPENVPN_SOCKS_LISTEN_PORT: "1080"
    entrypoint:
      - /bin/sh
      - /scripts/openvpn_tunnel.sh
    healthcheck:
      # Healthy only if traffic actually egresses through the SOCKS/tunnel path.
      test:
        - CMD-SHELL
        - "curl -fsS -m 10 --socks5 127.0.0.1:1080 https://www.google.com/generate_204 >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 12s
      start_period: 40s
      retries: 3
    logging: *default-logging

  updater:
    image: python:3.12-alpine
    container_name: xray-updater
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./config:/etc/xray
      - ./data:/var/log/xray
      - ./scripts:/scripts:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache curl jq ca-certificates >/dev/null
        update-ca-certificates >/dev/null 2>&1 || true
        while true; do
          /bin/sh /scripts/update_subscription.sh || true
          sleep "$(( ${SUB_UPDATE_INTERVAL_MIN:-60} * 60 ))"
        done
    env_file:
      - .env
    logging: *default-logging
